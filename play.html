<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140b2e">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>DessinTel · Joueur</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DessinTel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
  <script src="js/vendor/supabase.js" defer></script>
  <script type="module" src="js/play.js?v=1"></script>
</head>
<body class="play">
  <header class="topbar">
    <button id="editProfile" class="me-btn" title="Modifier mon profil">
      <span id="meAv" class="av">🙂</span><span id="meName">…</span><span class="swap" aria-hidden="true">🔄</span>
    </button>
    <span id="roundPill" class="pill" hidden></span>
    <span class="code-chip small">🔑 <b id="roomCode"></b></span>
    <span id="conn" class="conn"></span>
  </header>
  <div id="hostOff" class="banner warn" hidden>📴 Le maître du jeu est déconnecté… on l’attend.</div>

  <main class="play-main">
    <div id="status" class="status">
      <div id="title" class="st-title">Connexion…</div>
      <div id="sub" class="st-sub"></div>
    </div>
    <section id="taskBox" class="task" hidden></section>
    <section id="feedBox" class="feed-card" hidden><div id="feed" class="feed"></div></section>
    <section id="voteBox" class="card" hidden></section>
    <section id="endBox" class="card" hidden></section>
    <section id="sideCard" class="card" hidden>
      <h3 id="sideTitle" class="sec-title"></h3>
      <ol id="side" class="list"></ol>
    </section>
  </main>

  <div id="dock" class="dock" hidden></div>

  <div id="kicked" class="overlay" hidden>
    <div class="sheet center">
      <div class="tv-big">🚪</div>
      <h2>Tu as été retiré·e de la partie</h2>
      <p class="muted">Le maître du jeu t’a sorti de la liste des joueurs.</p>
      <button id="rejoin" class="btn big">Demander à revenir</button>
    </div>
  </div>

  <div id="join" class="overlay join">
    <form id="joinForm" class="sheet">
      <div class="join-head"><span id="preview" class="av xl">🙂</span><div><h2 id="joinTitle">Qui es-tu ?</h2><p id="joinHint" class="muted small" hidden></p></div></div>
      <div id="who" class="who" hidden>
        <div class="lbl">Choisis ton prénom</div>
        <div id="whoList" class="grid-who"></div>
      </div>
      <label class="lbl" id="nameLbl">Prénom
        <input name="name" maxlength="16" autocomplete="nickname" placeholder="Ex. Léa" required>
      </label>
      <div class="lbl">Avatar</div>
      <div id="avatars" class="grid-picks"></div>
      <div class="lbl">Couleur</div>
      <div id="colors" class="grid-swatches"></div>
      <button class="btn big go" type="submit">C’est parti ! 🎨</button>
    </form>
  </div>
</body>
</html>
