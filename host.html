<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140b2e">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>DessinTel · Maître du jeu</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DessinTel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
  <script src="js/vendor/supabase.js" defer></script>
  <script src="js/vendor/qrcode.js" defer></script>
  <script type="module" src="js/host.js?v=1"></script>
</head>
<body class="host">
  <header class="topbar">
    <a class="logo sm" href="index.html">Dessin<span>Tel</span></a>
    <button class="code-chip" data-act="qr" title="Afficher le QR code">🔑 <b id="roomCode">····</b></button>
    <span id="online" class="muted small"></span>
    <span id="conn" class="conn"></span>
    <button class="icon" data-act="roster" aria-label="Joueurs enregistrés">👥</button>
    <button class="icon" data-act="settings" aria-label="Réglages">⚙️</button>
  </header>
  <div id="dupHost" class="banner warn" hidden>⚠️ Un autre écran « maître du jeu » est ouvert pour cette salle. Garde-en un seul !</div>

  <main class="host-main">
    <section id="stage" class="card stage"></section>
    <section id="mine" class="card task" hidden></section>
    <section id="feedCard" class="feed-card" hidden><div id="feed" class="feed"></div></section>
    <section id="sideCard" class="card">
      <h3 id="sideTitle" class="sec-title"></h3>
      <ol id="side" class="list"></ol>
    </section>
  </main>

  <div id="dock" class="dock" hidden></div>

  <div id="qrModal" class="modal">
    <div class="sheet center">
      <h2>Rejoindre la partie</h2>
      <div id="qrBig" class="qrbox"></div>
      <p class="big-txt">Code <b class="code" id="roomCode2"></b></p>
      <p id="joinUrl" class="muted small break"></p>
      <button class="btn" data-act="close">Fermer</button>
    </div>
  </div>

  <div id="rosterModal" class="modal">
    <div class="sheet tall" id="rosterBody"></div>
  </div>

  <div id="meModal" class="modal">
    <div class="sheet tall" id="meBody"></div>
  </div>

  <div id="setModal" class="modal">
    <div class="sheet tall">
      <h2>⚙️ Réglages</h2>
      <form id="setForm" class="settings" onsubmit="return false">
        <label class="sel">✏️ Temps pour écrire
          <select name="writeSec">
            <option value="20">20 s</option><option value="30">30 s</option><option value="40">40 s</option><option value="60">1 min</option><option value="90">1 min 30</option><option value="0">Sans minuteur</option>
          </select>
        </label>
        <label class="sel">🎨 Temps pour dessiner
          <select name="drawSec">
            <option value="45">45 s</option><option value="60">1 min</option><option value="75">1 min 15</option><option value="90">1 min 30</option><option value="120">2 min</option><option value="180">3 min</option><option value="0">Sans minuteur</option>
          </select>
        </label>
        <label class="sel">📒 Étapes par carnet
          <select name="maxSteps">
            <option value="0">Tour complet (une par joueur)</option><option value="4">4 étapes</option><option value="6">6 étapes</option><option value="8">8 étapes</option><option value="10">10 étapes</option>
          </select>
        </label>
        <p id="setLocked" class="muted small" hidden>Les temps et le nombre d’étapes se changent entre deux parties.</p>
        <label class="switch"><input type="checkbox" name="sound"> <span>Sons sur ce téléphone</span></label>
      </form>
      <div class="tvbox">
        <p><b>📺 Écran TV</b> : ouvre cette adresse sur la télé ou un PC</p>
        <p id="tvUrl" class="muted small break"></p>
        <a id="tvLink" class="btn ghost" target="_blank">Ouvrir ici</a>
      </div>
      <div class="row">
        <button class="btn ghost" data-act="lobby">🔄 Retour au salon</button>
        <button class="btn ghost" data-act="newroom">🆕 Nouvelle salle</button>
      </div>
      <button class="btn" data-act="close">Fermer</button>
    </div>
  </div>
</body>
</html>
